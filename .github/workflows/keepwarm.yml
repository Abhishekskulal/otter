name: Keep backend warm

# Render free services spin down after 15 min idle (DESIGN.md §7). Pinging health every 10 min
# keeps the one instance awake; 24/7 at this cadence fits the ~750 free instance-hours per month.
# Set the repository variable HEALTHCHECK_URL to https://<your-service>.onrender.com/actuator/health.
# Note: Render does not officially support this and may change behaviour; the README demo GIF is the
# primary cold-start mitigation.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.HEALTHCHECK_URL }}" ]; then
            echo "HEALTHCHECK_URL variable not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 60 "${{ vars.HEALTHCHECK_URL }}" && echo "ok" || echo "unreachable (likely cold); ignoring"
