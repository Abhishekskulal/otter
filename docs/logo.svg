<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="otter">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11a492"/>
      <stop offset="1" stop-color="#0a7a6d"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#t)"/>
  <!-- text I-beam caret: editing text -->
