    <rect x="19.9" y="12" width="4.3" height="24" rx="2.1"/>
    <rect x="14.5" y="12" width="15.1" height="3.9" rx="1.95"/>
    <rect x="14.5" y="32.1" width="15.1" height="3.9" rx="1.95"/>
  </g>
  <!-- a second collaborator's cursor: two people, one document -->
  <circle cx="34.4" cy="15.4" r="4.4" fill="#f2b34d"/>
  <rect x="32.2" y="18.6" width="4.4" height="14.2" rx="2.2" fill="#f2b34d"/>
