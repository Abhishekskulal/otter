# Static deploy of the React client. Set TWO build env vars in the Netlify UI so the built client
# reaches the backend on Render:
#   VITE_WS_URL  = wss://<your-service>.onrender.com/ws     (WebSocket)
#   VITE_API_URL = https://<your-service>.onrender.com      (REST /api — without it, document
#                                                            loading hits the CDN and 404s)
# Cloudflare Pages equivalent: root directory "client", build command "npm run build",
# output directory "dist", and the same two build variables.
[build]
  base = "client"
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
