name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + property + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Runs ot-core jqwik properties (default strength) and the Testcontainers
      # reload tests — the Docker daemon is present on ubuntu-latest runners.
      # Any jqwik property failure fails the build (CLAUDE.md §7 Stage 3).
      - run: ./gradlew --no-daemon build

  frontend:
    name: Client type-check, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run test
        working-directory: client
      - run: npm run build
        working-directory: client

  image:
    name: Build server image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: otter-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
